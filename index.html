<style>
/* layout: ad bar, header, star of the week, filter chips + product grid, cart/checkout, control panel (products, look, settings, customers), floating WhatsApp */
:root{
  --bg:#FAF6FB;--surface:#FFFFFF;--fg:#231B2E;--muted:#6B6078;--line:#E6DCEB;--tile:#EFE4F5;
  --purple:#6D28D9;--burgundy:#7A1F3D;--on-accent:#FFFFFF;--soft:#F1E8F8;--ok:#1E7A4A;--bad:#B3261E;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15101C;--surface:#211A2B;--fg:#F2ECF7;--muted:#B3A8C2;--line:#3A2F4A;--tile:#2E2540;
  --purple:#A78BFA;--burgundy:#D4607F;--on-accent:#15101C;--soft:#2A2138;--ok:#6FD3A0;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15101C;--surface:#211A2B;--fg:#F2ECF7;--muted:#B3A8C2;--line:#3A2F4A;--tile:#2E2540;
  --purple:#A78BFA;--burgundy:#D4607F;--on-accent:#15101C;--soft:#2A2138;--ok:#6FD3A0;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1040px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo .mark{flex:none}
.logo .lt{color:var(--purple)}
.logo .lt span{color:var(--burgundy)}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{min-height:40px;min-width:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ibtn:hover{border-color:var(--purple)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.dock{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-block:28px 0}
.dk{font-size:13px;color:var(--muted)}
.dk[aria-expanded="true"]{border-color:var(--purple);color:var(--text)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.ibtn.bump{animation:bump .6s ease;border-color:var(--purple)}
.ibtn{position:relative}
.count{background:var(--burgundy);color:var(--on-accent);border-radius:10px;font-size:12px;min-width:20px;padding:0 6px;line-height:20px;text-align:center}
.ad{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--burgundy);color:var(--on-accent);padding:10px 16px;border-radius:0 0 10px 10px;text-align:center;font-weight:500}
.adbtn{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid currentColor;background:transparent;color:inherit}
.hero{padding-block:28px 12px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.3;margin:0 0 6px;font-weight:700;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.star{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px 14px;border:1px solid var(--purple);background:var(--soft);border-radius:10px}
.star svg{width:32px;height:32px;stroke:var(--purple);fill:none;stroke-width:1.8;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:16px}
.chip{min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--tile);position:relative;display:flex;align-items:flex-end;padding:8px;color:var(--muted);font-size:13px;overflow:hidden}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px}

  if(el.id==="pUnl"){$("pStock").disabled=el.checked;if(el.checked)$("pStock").value=""}
  if(el.id==="pImg"&&el.files&&el.files[0]){
    var f=el.files[0],keep={ar:$("pAr").value,en:$("pEn").value,tp:$("pType").value,pr:$("pPrice").value,od:$("pOld").value,sk:$("pStock").value,un:$("pUnl").checked,da:$("pDa").value,de:$("pDe").value};
    resizeImage(f,function(d){draftImg=d;renderPanel();
      $("pAr").value=keep.ar;$("pEn").value=keep.en;$("pType").value=keep.tp;$("pPrice").value=keep.pr;$("pOld").value=keep.od;$("pStock").value=keep.sk;$("pUnl").checked=keep.un;$("pStock").disabled=keep.un;$("pDa").value=keep.da;$("pDe").value=keep.de})}
  if(el.id==="c1"||el.id==="c2"){
    S.c1=$("c1").value;S.c2=$("c2").value;save();applyColors()}
  if(el.id==="fGov")renderCart();
});
document.addEventListener("input",function(e){
  if(e.target.id==="c1"||e.target.id==="c2"){S.c1=$("c1").value;S.c2=$("c2").value;applyColors()}
});
function openSec(id,toggle){var el=$(id),show=toggle?el.hidden:true;el.hidden=!show;
  var bt={cart:"cartBtn",sell:"sellBtn",merchant:"merBtn"}[id];if(bt){var x=$(bt);if(x)x.setAttribute("aria-expanded",show)}
  if(show)el.scrollIntoView({behavior:"smooth"})}
function bumpCart(){var c=$("cartBtn");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
$("cartBtn").setAttribute("aria-expanded","false");$("cartBtn").setAttribute("aria-controls","cart");
$("cartBtn").addEventListener("click",function(){openSec("cart",true)});
$("sellBtn").addEventListener("click",function(){openSec("sell",true)});
$("merBtn").addEventListener("click",function(){openSec("merchant",true)});
$("langBtn").addEventListener("click",function(){lang=lang==="ar"?"en":"ar";setPref("laqta-lang",lang);renderAll()});
$("themeBtn").addEventListener("click",function(){
  var d=document.documentElement,cur=d.getAttribute("data-theme");
  if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  var nx=cur==="dark"?"light":"dark";d.setAttribute("data-theme",nx);setPref("laqta-theme",nx);renderPanel()});
document.querySelectorAll("input[name=pay]").forEach(function(r){r.addEventListener("change",function(){
  var vf=document.querySelector("input[name=pay]:checked").value==="vf";
  $("vfBox").hidden=!vf;$("optVf").classList.toggle("sel",vf)})});
$("form").addEventListener("submit",function(e){
  e.preventDefault();
  var err=$("err");err.textContent="";
  if(!cart.length){err.textContent=t("eCart");return}
  if(!$("fName").value.trim()){err.textContent=t("eName");$("fName").focus();return}
  if(!/^01[0125]\d{8}$/.test($("fPhone").value.trim())){err.textContent=t("ePhone");$("fPhone").focus();return}
  if(!$("fGov").value){err.textContent=t("eGov");$("fGov").focus();return}
  if(!$("fAddr").value.trim()){err.textContent=t("eAddr");$("fAddr").focus();return}
  var vf=document.querySelector("input[name=pay]:checked").value==="vf";
  var sub=0,lines=cart.map(function(i){var p=pById(i.id);sub+=p.p*i.q;return "- "+pname(p)+" x"+i.q+" = "+money(p.p*i.q)}),sh=shipPrice();
  var gov=$("fGov").options[$("fGov").selectedIndex].text.replace(/\s*\(.*\)$/,"");
  var text=[t("msgHead"),"",t("mName")+": "+$("fName").value.trim(),t("mPhone")+": "+$("fPhone").value.trim(),t("mGov")+": "+gov,t("mAddr")+": "+$("fAddr").value.trim(),"",t("mItems")+":"].concat(lines).concat(["",t("mShip")+": "+money(sh),t("mTotal")+": "+money(sub+sh),t("mPay")+": "+(vf?t("vf"):t("cod"))]).join("\n");
  var url="https://wa.me/"+encodeURIComponent(S.wa)+"?text="+encodeURIComponent(text);
  $("done").innerHTML='<div class="ok"><b>'+t("okTitle")+'</b><p class="note">'+t("waNote")+'</p><a class="primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="'+url+'" target="_blank" rel="noopener">'+t("waOpen")+'</a><pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--muted);margin:10px 0 0">'+esc(text)+'</pre></div>';
});

var tmr;function toast(m){var e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(function(){e.hidden=true},2600)}
function productUrl(id){var u=location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/,"");return u+"p-"+id+".html"}
var lbL=[],lbI=0;
function LD(){return lang==="ar"?1:-1}
function showLb(){$("lbi").src=lbL[lbI];var m=lbL.length>1;$("lbp").hidden=!m;$("lbn").hidden=!m;$("lbc").hidden=!m;$("lbc").textContent=(lbI+1)+" / "+lbL.length}
function openLb(list,i){lbL=list;lbI=i;showLb();$("lb").hidden=false;$("lbx").focus()}
function stepLb(d){if(lbL.length<2)return;lbI=(lbI+d+lbL.length)%lbL.length;showLb()}
var tx0=null;
$("lb").addEventListener("touchstart",function(e){tx0=e.touches[0].clientX},{passive:true});
$("lb").addEventListener("touchend",function(e){if(tx0===null)return;var dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)stepLb(dx>0?LD():-LD())},{passive:true});
function openFromHash(){
  var m=/^#product-(\d+)$/.exec(location.hash);if(!m)return;
  var p=pById(+m[1]);if(!p)return;
  filter="all";cat="all";qs="";sortKey="new";pmin="";pmax="";avail=false;cond="all";$("q").value="";
  renderStatic();renderGrid();
  var el=document.getElementById("product-"+p.id);
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("hl");setTimeout(function(){el.classList.remove("hl")},3000)}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.share){
    var id=+b.dataset.share,p=pById(id),url=productUrl(id);
    if(navigator.share){navigator.share({title:pname(p),url:url}).catch(function(){})}
    else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast(t("copied"))},function(){toast(url)})}
    else toast(url);
    return}
  if(b.dataset.lb){var q=pById(+b.dataset.lb),l=q?(b.dataset.src==="g"?imgsOf(q):(q.di||[])):[];if(l[+b.dataset.n])openLb(l,+b.dataset.n);return}
  if(b.id==="lbp"){stepLb(LD());return}
  if(b.id==="lbn"){stepLb(-LD());return}
  if(b.id==="lbx"){$("lb").hidden=true;return}
  if(b.id==="merGo"){openSec("merchant");return}
    if(b.id==="polBtn"){var sc=$("policy");sc.hidden=!sc.hidden;if(!sc.hidden)sc.scrollIntoView({behavior:"smooth"});return}
});
$("lb").addEventListener("click",function(e){if(e.target===this)this.hidden=true});
document.addEventListener("keydown",function(e){if($("lb").hidden)return;if(e.key==="Escape")$("lb").hidden=true;if(e.key==="ArrowLeft")stepLb(LD());if(e.key==="ArrowRight")stepLb(-LD())});
document.addEventListener("input",function(e){
  if(e.target.id==="pmin"){pmin=e.target.value;renderGrid()}
  if(e.target.id==="pmax"){pmax=e.target.value;renderGrid()}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="sortSel"){sortKey=el.value;renderGrid()}
  if(el.id==="condSel"){cond=el.value;renderGrid()}
  if(el.id==="availCk"){avail=el.checked;renderGrid()}
});
$("sellForm").addEventListener("submit",function(e){
  e.preventDefault();
  var er=$("sellErr");er.textContent="";
  var nm=$("sName").value.trim(),ph=$("sPhone").value.trim(),it=$("sItem").value.trim(),pr=parseInt($("sPrice").value,10);
  if(!nm){er.textContent=t("eName");$("sName").focus();return}
  if(!/^01[0125]\d{8}$/.test(ph)){er.textContent=t("ePhone");$("sPhone").focus();return}
  if(!it){er.textContent=t("eItem");$("sItem").focus();return}
  if(!(pr>0)){er.textContent=t("ePrice2");$("sPrice").focus();return}
  var text=[t("sellHead"),"",t("mName")+": "+nm,t("mPhone")+": "+ph,t("sItem")+": "+it,t("sCat")+": "+t("k_"+$("sCat").value),t("sCond")+": "+t("g_"+$("sCondSel").value),t("sellPrice")+": "+money(pr),t("sellDesc")+": "+($("sDesc").value.trim()||"-"),"",t("sellPics")].join("\n");
  var url="https://wa.me/"+encodeURIComponent(S.wa)+"?text="+encodeURIComponent(text);
  $("sellDone").innerHTML='<div class="ok"><b>'+t("sellOk")+'</b><p class="note">'+t("sellNote")+'</p><a class="primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="'+url+'" target="_blank" rel="noopener">'+t("sellOpen")+'</a></div>';
});

$("merForm").addEventListener("submit",function(e){
  e.preventDefault();
  var er=$("merErr");er.textContent="";
  var nm=$("mName").value.trim(),ph=$("mPhone").value.trim(),it=$("mItem").value.trim(),pr=parseInt($("mPrice").value,10),q=parseInt($("mQty").value,10);
  if(!nm){er.textContent=t("eName");$("mName").focus();return}
  if(!/^01[0125]\d{8}$/.test(ph)){er.textContent=t("ePhone");$("mPhone").focus();return}
  if(!it){er.textContent=t("eMItem");$("mItem").focus();return}
  if(!(q>=1)){er.textContent=t("eMQty");$("mQty").focus();return}
  if(!(pr>0)){er.textContent=t("ePrice2");$("mPrice").focus();return}
  var text=[t("merHead"),"",t("mName")+": "+nm,t("merStore")+": "+($("mStore").value.trim()||"-"),t("mPhone")+": "+ph,t("mItem")+": "+it,t("sCat")+": "+t("k_"+$("mCat").value),t("merQty")+": "+q,t("mPrice")+": "+money(pr),t("sellDesc")+": "+($("mDesc").value.trim()||"-"),"",t("merPics")].join("\n");
  var url="https://wa.me/"+encodeURIComponent(S.wa)+"?text="+encodeURIComponent(text);
  $("merDone").innerHTML='<div class="ok"><b>'+t("merOk")+'</b><p class="note">'+t("sellNote")+'</p><a class="primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="'+url+'" target="_blank" rel="noopener">'+t("sellOpen")+'</a></div>';
});

var sl=getPref("laqta-lang");if(sl==="ar"||sl==="en")lang=sl;
var st=getPref("laqta-theme");if(st==="dark"||st==="light")document.documentElement.setAttribute("data-theme",st);
applyColors();
renderAll();
openFromHash();window.addEventListener("hashchange",openFromHash);
</script>
